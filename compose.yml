services:
  promethues:
    image: prom/prometheus
    networks:
      - proxy_https_default
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - 9090:9090
  grafana:
    image: grafana/grafana
    depends_on:
      - promethues
    networks:
      - proxy_https_default
    ports:
      - 3000:3000
    environment:
      GF_SECURITY_ADMIN_USERS: admin
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana-storage:/var/lib/grafana


networks:
  proxy_https_default:
    external: true

volumes:
  grafana-storage: